<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD Frame Binding Player -> Script API 2.10</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #121212; color: #e0e0e0; padding: 12px; font-size: 13px; }
        h3 { color: #4caf50; margin-bottom: 4px; font-size: 16px; text-align: center; }
        .sub { font-size: 11px; color: #888; text-align: center; margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin: 6px 0 2px; color: #bbb; font-size: 11px; }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%; background: #1e1e1e; color: #00ff66; border: 1px solid #333;
            border-radius: 6px; padding: 8px; font-family: monospace; font-size: 11px; outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: #4caf50; }
        .row { display: flex; gap: 8px; margin-bottom: 6px; }
        .col { flex: 1; }
        textarea { height: 100px; resize: vertical; }
        .btn-group { display: flex; gap: 8px; margin: 10px 0; }
        button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .btn-import { background: #9c27b0; color: #fff; }
        .btn-conv { background: #4caf50; color: #fff; }
        .btn-copy { background: #2196f3; color: #fff; }
        .btn-dl { background: #ff9800; color: #fff; }
        .btn-danger { background: #f44336; color: #fff; }
        .btn-reset { background: #607d8b; color: #fff; }
        #fileInput { display: none; }
        #output { height: 120px; color: #64b5f6; }
        .info { background: #1e1e1e; border-left: 3px solid #4caf50; padding: 8px; margin-top: 8px; font-size: 11px; color: #aaa; border-radius: 0 4px 4px 0; }
        .info code { color: #fff; background: #2a2a2a; padding: 2px 4px; border-radius: 3px; font-family: monospace; }
        .checkbox-group { display: flex; gap: 12px; margin: 6px 0 10px; align-items: center; }
        .checkbox-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: #4caf50; font-size: 11px; }
        
        /* Painel de Edição de Frames */
        .frame-editor { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 10px; margin: 10px 0; display: none; }
        .frame-editor select { height: 120px; background: #121212; color: #fff; border-color: #444; }
        .frame-editor option { padding: 4px; border-bottom: 1px solid #222; }
        .frame-editor option:checked { background: #e91e63 !important; color: #fff; }
        .editor-hint { font-size: 10px; color: #888; margin-bottom: 6px; }
    </style>
</head>
<body>

    <h3>HUD Frame Binding Extractor</h3>
    <p class="sub">Extrai Bindings para /title (Script API 2.10.0+)</p>

    <!-- Configurações de Execução -->
    <div class="row">
        <div class="col">
            <label for="selector">Seletor de Alvo:</label>
            <input type="text" id="selector" value="@a" placeholder="Ex: @a, @p">
        </div>
        <div class="col">
            <label for="ticks">Intervalo (Ticks):</label>
            <input type="number" id="ticks" value="2" min="1" placeholder="Ex: 2">
        </div>
        <div class="col">
            <label for="loopOpt">Repetir (Loop):</label>
            <select id="loopOpt">
                <option value="true" selected>Sim</option>
                <option value="false">Não</option>
            </select>
        </div>
    </div>

    <!-- Configurações de Scriptevents Customizados -->
    <div class="row">
        <div class="col">
            <label for="evtStart">ScriptEvent Iniciar:</label>
            <input type="text" id="evtStart" value="hud:start" placeholder="Ex: hud:start">
        </div>
        <div class="col">
            <label for="evtStop">ScriptEvent Parar:</label>
            <input type="text" id="evtStop" value="hud:stop" placeholder="Ex: hud:stop">
        </div>
    </div>

    <!-- Opções de Limpeza de Frames -->
    <div class="checkbox-group">
        <label><input type="checkbox" id="removeDupes" checked> Remover Duplicados e Vazios</label>
        <label><input type="checkbox" id="sortFrames" checked> Ordenar Numericamente (1, 2, 3...)</label>
    </div>

    <label for="jsonInput">HUD JSON Input:</label>
    <textarea id="jsonInput" placeholder="Cole o hud_screen.json aqui ou importe o arquivo abaixo..."></textarea>

    <!-- Upload de Arquivos Oculto -->
    <input type="file" id="fileInput" accept=".json" onchange="handleFileImport(event)">

    <div class="btn-group">
        <button class="btn-import" onclick="document.getElementById('fileInput').click()">📁 Importar JSON</button>
        <button class="btn-conv" onclick="convertHUD()">⚡ Gerar JS</button>
    </div>

    <!-- Painel de Remoção Manual de Frames -->
    <div class="frame-editor" id="frameEditorPanel">
        <label for="frameSelect">Gerenciar Frames Extraídos (<span id="frameCount">0</span>):</label>
        <p class="editor-hint">💡 Dica: No celular toque para selecionar vários. No PC segure <b>Ctrl</b> ou <b>Shift</b>.</p>
        <select id="frameSelect" multiple></select>
        <div class="btn-group" style="margin-bottom:0; margin-top:8px;">
            <button class="btn-danger" onclick="removeSelectedFrames()">🗑️ Remover Selecionados</button>
            <button class="btn-reset" onclick="convertHUD()">🔄 Restaurar Todos</button>
        </div>
    </div>

    <label for="output">Resultado JS (Script API):</label>
    <textarea id="output" readonly placeholder="O script gerado aparecerá aqui..."></textarea>

    <div class="btn-group">
        <button class="btn-copy" onclick="copyOutput()">Copiar JS</button>
        <button class="btn-dl" onclick="downloadJS()">Baixar .js</button>
    </div>

    <div class="info">
        <b>Comandos definidos para uso no jogo:</b><br>
        • Iniciar: <code id="lblStart">/scriptevent hud:start</code><br>
        • Parar: <code id="lblStop">/scriptevent hud:stop</code>
    </div>

    <script>
        let currentFramesList = [];

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('jsonInput').value = e.target.result;
                alert('Arquivo "' + file.name + '" carregado com sucesso!');
            };
            reader.onerror = function() {
                alert('Erro ao ler o arquivo JSON!');
            };
            reader.readAsText(file);
        }

        function convertHUD() {
            const raw = document.getElementById('jsonInput').value.trim();
            const selector = document.getElementById('selector').value.trim() || '@a';
            const ticks = parseInt(document.getElementById('ticks').value) || 2;
            const isLoop = document.getElementById('loopOpt').value === 'true';
            
            const evtStart = document.getElementById('evtStart').value.trim() || 'hud:start';
            const evtStop = document.getElementById('evtStop').value.trim() || 'hud:stop';

            const removeDupes = document.getElementById('removeDupes').checked;
            const sortFrames = document.getElementById('sortFrames').checked;

            document.getElementById('lblStart').textContent = '/scriptevent ' + evtStart;
            document.getElementById('lblStop').textContent = '/scriptevent ' + evtStop;

            if (!raw) return alert('Por favor, cole o conteúdo ou importe um arquivo JSON válido.');

            try {
                const jsonObj = JSON.parse(raw);
                let frames = [];

                for (const key in jsonObj) {
                    const item = jsonObj[key];
                    if (item && item.type === "image") {
                        let frameName = null;

                        if (Array.isArray(item.bindings)) {
                            for (const b of item.bindings) {
                                if (b.source_property_name && typeof b.source_property_name === 'string') {
                                    const match = b.source_property_name.match(/'([^']+)'/);
                                    if (match && match[1]) {
                                        frameName = match[1];
                                        break;
                                    }
                                }
                            }
                        }

                        const targetFrame = (frameName || key).trim();
                        if (targetFrame.length > 0) {
                            frames.push(targetFrame);
                        }
                    }
                }

                frames = frames.filter(f => f && typeof f === 'string' && f.trim().length > 0);

                if (removeDupes) {
                    frames = [...new Set(frames)];
                }

                if (sortFrames) {
                    frames.sort((a, b) => {
                        const numA = parseInt((a.match(/\d+$/) || [0])[0], 10);
                        const numB = parseInt((b.match(/\d+$/) || [0])[0], 10);
                        if (!isNaN(numA) && !isNaN(numB) && numA !== numB) {
                            return numA - numB;
                        }
                        return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
                    });
                }

                if (frames.length === 0) {
                    return alert('Nenhuma imagem válida foi encontrada no JSON.');
                }

                currentFramesList = frames;
                updateFrameSelectUI();
                updateScriptOutput();

            } catch (e) {
                alert('Erro ao processar JSON: ' + e.message);
            }
        }

        function updateFrameSelectUI() {
            const select = document.getElementById('frameSelect');
            const panel = document.getElementById('frameEditorPanel');
            const countLbl = document.getElementById('frameCount');
            
            select.innerHTML = '';
            currentFramesList.forEach((frame, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `${index + 1}. ${frame}`;
                select.appendChild(opt);
            });

            countLbl.textContent = currentFramesList.length;
            panel.style.display = currentFramesList.length > 0 ? 'block' : 'none';
        }

        function removeSelectedFrames() {
            const select = document.getElementById('frameSelect');
            const selectedIndexes = Array.from(select.selectedOptions).map(opt => parseInt(opt.value));

            if (selectedIndexes.length === 0) {
                return alert('Selecione pelo menos um frame na lista para remover!');
            }

            // Filtrar removendo os índices selecionados
            currentFramesList = currentFramesList.filter((_, index) => !selectedIndexes.includes(index));

            updateFrameSelectUI();
            updateScriptOutput();
        }

        function updateScriptOutput() {
            const selector = document.getElementById('selector').value.trim() || '@a';
            const ticks = parseInt(document.getElementById('ticks').value) || 2;
            const isLoop = document.getElementById('loopOpt').value === 'true';
            const evtStart = document.getElementById('evtStart').value.trim() || 'hud:start';
            const evtStop = document.getElementById('evtStop').value.trim() || 'hud:stop';

            const jsCode = generateScript(currentFramesList, selector, ticks, isLoop, evtStart, evtStop);
            document.getElementById('output').value = jsCode;
        }

        function generateScript(frames, selector, ticks, isLoop, evtStart, evtStop) {
            const framesJson = JSON.stringify(frames);
            return `import { system, world } from "@minecraft/server";

// Configurações do HUD
const FRAMES = ${framesJson};
const TARGET_SELECTOR = "${selector}";
const FRAME_INTERVAL_TICKS = ${ticks};
const LOOP_ENABLED = ${isLoop};

// Scriptevents configurados
const EVENT_START = "${evtStart}";
const EVENT_STOP = "${evtStop}";

let hudIntervalId = null;
let currentFrameIndex = 0;

function playNextFrame() {
    if (FRAMES.length === 0) return;

    const frameBindingName = FRAMES[currentFrameIndex];
    
    try {
        world.getDimension("overworld").runCommand(\`title \${TARGET_SELECTOR} title \${frameBindingName}\`);
    } catch (err) {
        console.error("[HUD Script] Erro ao executar /title: ", err);
    }

    currentFrameIndex++;

    if (currentFrameIndex >= FRAMES.length) {
        if (LOOP_ENABLED) {
            currentFrameIndex = 0;
        } else {
            stopHudAnimation();
        }
    }
}

function startHudAnimation() {
    if (hudIntervalId !== null) {
        system.clearRun(hudIntervalId);
    }
    currentFrameIndex = 0;
    hudIntervalId = system.runInterval(() => {
        playNextFrame();
    }, FRAME_INTERVAL_TICKS);

    world.sendMessage("§a[HUD System] Animação iniciada! (" + FRAMES.length + " frames | Loop: " + (LOOP_ENABLED ? "Ativado" : "Desativado") + ")");
}

function stopHudAnimation() {
    if (hudIntervalId !== null) {
        system.clearRun(hudIntervalId);
        hudIntervalId = null;
        world.sendMessage("§c[HUD System] Animação finalizada/parada.");
    }
}

system.afterEvents.scriptEventReceive.subscribe((event) => {
    const { id } = event;
    if (id === EVENT_START) startHudAnimation();
    if (id === EVENT_STOP) stopHudAnimation();
});

console.warn("[HUD Script API 2.10.0] Carregado. Use /scriptevent " + EVENT_START + " ou /scriptevent " + EVENT_STOP);
`;
        }

        function copyOutput() {
            const out = document.getElementById('output');
            if (!out.value) return alert('Nada para copiar!');
            
            out.select();
            out.setSelectionRange(0, 99999);
            
            try {
                navigator.clipboard.writeText(out.value).then(() => {
                    alert('Código copiado para a área de transferência!');
                }).catch(() => {
                    document.execCommand('copy');
                    alert('Código copiado para a área de transferência!');
                });
            } catch (err) {
                document.execCommand('copy');
                alert('Código copiado para a área de transferência!');
            }
        }

        function downloadJS() {
            const text = document.getElementById('output').value;
            if (!text) return alert('Gere o script primeiro antes de baixar!');

            const filename = 'main.js';
            const blob = new Blob([text], { type: 'text/javascript;charset=utf-8' });

            if (navigator.msSaveBlob) {
                navigator.msSaveBlob(blob, filename);
                return;
            }

            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = filename;
            
            document.body.appendChild(a);
            a.click();

            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        }
    </script>
</body>
</html>
